version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hquser
      POSTGRES_PASSWORD: hqpassword
      POSTGRES_DB: retail_hq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hquser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: hq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # HQ Backend
  hq-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hquser:hqpassword@postgres:5432/retail_hq?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 4000
      WS_PORT: 4001
    ports:
      - "4000:4000"
      - "4001:4001"
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env

  # Sync Worker
  sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hq-sync-worker
    restart: unless-stopped
    depends_on:
      - hq-backend
      - postgres
      - redis
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hquser:hqpassword@postgres:5432/retail_hq?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: ["node", "dist/workers/syncWorker.js"]
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
