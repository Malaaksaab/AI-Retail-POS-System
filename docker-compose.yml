version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: retail-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multistore_retail
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: retail-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retail-backend
    restart: always
    ports:
      - '3000:3000'
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/multistore_retail?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=change-this-in-production-use-strong-secret
      - JWT_REFRESH_SECRET=change-this-refresh-secret-in-production
      - PORT=3000
      - WS_PORT=3001
      - CORS_ORIGIN=http://localhost:5173,http://localhost:5174
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm run start:prod"

  # HQ Frontend
  hq-frontend:
    build:
      context: ./hq-frontend
      dockerfile: Dockerfile
    container_name: retail-hq-frontend
    restart: always
    ports:
      - '5173:80'
    environment:
      - VITE_API_URL=http://localhost:3000/api/v1
      - VITE_WS_URL=ws://localhost:3001
    depends_on:
      - backend

  # POS Frontend
  pos-frontend:
    build:
      context: ./pos-frontend
      dockerfile: Dockerfile
    container_name: retail-pos-frontend
    restart: always
    ports:
      - '5174:80'
    environment:
      - VITE_API_URL=http://localhost:3000/api/v1
      - VITE_WS_URL=ws://localhost:3001
      - VITE_OFFLINE_MODE=true
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
